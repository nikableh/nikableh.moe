# https://github.com/actions/deploy-pages#usage
name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enter nix devShell
        uses: nicknovitski/nix-develop@v1
      - run: nix flake check
      - run: pnpm install
      - run: npx nuxt build --preset github_pages
      - name: Check SEO tags survived the build
        run: |
          grep -q 'rel="canonical"' .output/public/index.html
          grep -q 'property="og:image"' .output/public/index.html
          grep -q 'application/ld+json' .output/public/index.html
          test -f .output/public/sitemap.xml
          test -f .output/public/robots.txt
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.output/public
          include-hidden-files: true

  deploy:
    needs: build
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  lhci:
    name: Lighthouse
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Lighthouse CI against deployed site
        run: |
          npx @lhci/cli autorun \
            --collect.url=https://nikableh.moe/
